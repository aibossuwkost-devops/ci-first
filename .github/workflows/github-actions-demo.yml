name: CI Pipeline

on:
  push:
    branches:
      - main
      - trial

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create note
        run: echo 'заметка' > note.txt

      - uses: actions/upload-artifact@v4
        with:
          name: note-artifact
          path: note.txt

  check:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4 # <-- ОБЯЗАТЕЛЬНО ДОБАВИТЬ СЮДА

      - uses: actions/download-artifact@v4
        with:
          name: note-artifact

      - name: Read note
        run: cat note.txt

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Здесь checkout не нужен, так как вы не используете файлы из репозитория,
      # а только выводите текст и переменную окружения.
      - name: Publish script
        run: echo "Выкладка запущена человеком"

      - name: Show application name
        run: echo "Имя: ${{ vars.APP_NAME }}"
