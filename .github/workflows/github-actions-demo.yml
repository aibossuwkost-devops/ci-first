name: CI First

on: [push]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: echo "Подготовка завершена"

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: echo "Проверка завершена"

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        run: echo "Выкладка завершена"
