name: My Pipeline

on:
  push:

jobs:
  note:
    name: Create note
    runs-on: ubuntu-latest
    steps:
      - name: Create file
        run: echo "заметка" > note.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: note
          path: note.txt

  read:
    name: Read note
    runs-on: ubuntu-latest
    needs: note
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: note

      - name: Read file
        run: cat note.txt

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "Выкладка с основной ветки"

