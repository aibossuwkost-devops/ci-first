name: CI

on:
  push:
  
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md
      - name: show
        env:
          APP_NAME: ${{vars.APP_NAME}}
        run: |
          echo "Имя: $APP_NAME"
      - name: secret
        env:
          NOTE_TOKEN: ${{secrets.NOTE_TOKEN}}
        run: |
          test -n "$NOTE_TOKEN"
          echo "Секрет на месте"
