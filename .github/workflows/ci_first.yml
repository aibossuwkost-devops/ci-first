name: ci

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python app.py
      - name: show
        env:
          APP_NAME: ${{ vars.APP_NAME }}
        run: 'echo "Имя: $APP_NAME"'
      - name: secret
        env:
          NOTE_TOKEN: ${{ secrets.NOTE_TOKEN }}
        run: |
          test -n "$NOTE_TOKEN"
          echo "Секрет на месте"

  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -lf "$HOME/.ssh/id_ed25519"

